services:
  - type: web
    name: little-learner-hub
    env: node
    # Production runs on Standard (2GB). Starter (~512MB) is too tight for the ~17MB
    # in-memory store + full-document clones — see docs/RENDER_OOM_MEMORY.md.
    plan: standard
    buildCommand: "npm install"
    # Match live Dashboard start command. Do not cap V8 at 300MB on a 2GB instance —
    # that forced RSS near the old System Health critical threshold (280MB).
    startCommand: "node server/index.js"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # System Health memory thresholds scale from this (warn ~45% / critical ~70%).
      - key: MONITOR_INSTANCE_MEMORY_MB
        value: "2048"
      - key: SITE_URL
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_FOUNDING_MONTHLY
        sync: false
      - key: STRIPE_PRICE_PRO_MONTHLY
        sync: false
      - key: STRIPE_PRICE_PRO_ANNUAL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: ADMIN_EMAIL
        sync: false
      # Optional comma-separated extra owner logins (iCloud aliases are already built in).
      - key: ADMIN_EMAILS
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_ACCESS_CODE
        sync: false
      - key: ADMIN_NAME
        value: Leah
      - key: SUPPORT_POSTAL_ADDRESS
        sync: false
      # Closeout: live claimed was 46 on 2026-07-29. Limit 48 leaves exactly 2 new spots.
      # Existing Founding Members keep $9.99/month locked while continuously active regardless of this limit.
      - key: FOUNDING_MEMBER_LIMIT
        value: "48"
      - key: PUBLIC_FOUNDING_CLAIMED_BASE
        value: 15
      - key: DATABASE_PROVIDER
        sync: false
      - key: PRODUCTION_DATABASE_URL
        sync: false
      - key: PRODUCTION_DATABASE_SERVICE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SUPPORT_EMAIL_FROM
        value: "Little Learner Hub <support@littlelearnershubbyleah.com>"
      - key: SUPPORT_EMAIL_TO
        value: "support@littlelearnershubbyleah.com"
      # Opt-in only. Leave unset/false so sparse Stripe rebuild never runs automatically at boot.
      - key: ALLOW_BOOT_SPARSE_STORE_RECOVERY
        value: "false"
      # Opt-in only. Blocks catastrophic full-store inventory drops unless intentionally enabled.
      - key: ALLOW_DESTRUCTIVE_STORE_WRITE
        value: "false"
      # Keep false until Leah explicitly approves automated email campaigns.
      - key: EMAIL_AUTOMATIONS_ENABLED
        value: "false"
      # Meta Pixel + Conversions API (never put the access token in frontend code).
      - key: META_PIXEL_ID
        sync: false
      - key: META_CAPI_ACCESS_TOKEN
        sync: false
      - key: META_TRACKING_ENABLED
        sync: false
      - key: META_PIXEL_ENABLED
        sync: false
      - key: META_CAPI_ENABLED
        sync: false
      - key: META_CAPI_TEST_EVENT_CODE
        sync: false
      - key: STORE_BACKUP_RETENTION
        value: "14"
      # Push notifications work with no setup — VAPID keys auto-generate and
      # persist in the database on first boot. Set these only if you want to
      # pin a specific key pair (see docs/MESSAGING_AND_PUSH_SETUP.md).
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
