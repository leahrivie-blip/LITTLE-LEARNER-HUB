services:
  - type: web
    name: little-learner-hub
    env: node
    # Starter (~512MB) is tight for the ~17MB in-memory store + full-document clones.
    # Prefer Standard (2GB) in the Dashboard if Render emails OOM restarts — see docs/RENDER_OOM_MEMORY.md.
    plan: starter
    buildCommand: "npm install"
    startCommand: "node --max-old-space-size=300 server/index.js"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SITE_URL
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_FOUNDING_MONTHLY
        sync: false
      - key: STRIPE_PRICE_PRO_MONTHLY
        sync: false
      - key: STRIPE_PRICE_PRO_ANNUAL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: ADMIN_EMAIL
        sync: false
      # Optional comma-separated extra owner logins (iCloud aliases are already built in).
      - key: ADMIN_EMAILS
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_ACCESS_CODE
        sync: false
      - key: ADMIN_NAME
        value: Leah
      - key: SUPPORT_POSTAL_ADDRESS
        sync: false
      # Closeout: live claimed was 45 on 2026-07-29. Limit 47 leaves exactly 2 new spots.
      # Existing Founding Members keep $9.99/month locked while continuously active regardless of this limit.
      - key: FOUNDING_MEMBER_LIMIT
        value: "47"
      - key: PUBLIC_FOUNDING_CLAIMED_BASE
        value: 15
      - key: DATABASE_PROVIDER
        sync: false
      - key: PRODUCTION_DATABASE_URL
        sync: false
      - key: PRODUCTION_DATABASE_SERVICE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SUPPORT_EMAIL_FROM
        value: "Little Learner Hub <support@littlelearnershubbyleah.com>"
      - key: SUPPORT_EMAIL_TO
        value: "support@littlelearnershubbyleah.com"
      # Opt-in only. Leave unset/false so sparse Stripe rebuild never runs automatically at boot.
      - key: ALLOW_BOOT_SPARSE_STORE_RECOVERY
        value: "false"
      # Opt-in only. Blocks catastrophic full-store inventory drops unless intentionally enabled.
      - key: ALLOW_DESTRUCTIVE_STORE_WRITE
        value: "false"
      # Keep false until Leah explicitly approves automated email campaigns.
      - key: EMAIL_AUTOMATIONS_ENABLED
        value: "false"
      - key: STORE_BACKUP_RETENTION
        value: "14"
      # Push notifications work with no setup — VAPID keys auto-generate and
      # persist in the database on first boot. Set these only if you want to
      # pin a specific key pair (see docs/MESSAGING_AND_PUSH_SETUP.md).
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
