name: User Activity Touch (Postgres)

# Isolated disposable Postgres 16 — real integration for PR #897 touch ledger.
# Never uses production DATABASE_URL or Render credentials.
on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/user-activity-touch-pg.yml"
      - "server/user-activity-touch-store.js"
      - "server/index.js"
      - "scripts/test-user-activity-touch-pg.js"
      - "scripts/test-user-activity-touch*.js"
      - "scripts/mock-pg-preload.js"

concurrency:
  group: touch-pg-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  touch-postgres-integration:
    name: npm run test:user-activity-touch-pg
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: llh_touch_ci
          POSTGRES_PASSWORD: llh_touch_ci_secret
          POSTGRES_DB: llh_touch_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U llh_touch_ci -d llh_touch_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      NODE_ENV: test
      # Fail closed if application code accidentally reads production URLs in this job.
      PRODUCTION_DATABASE_URL: ""
      DATABASE_URL: ""
      LLH_USER_ACTIVITY_TOUCH_TEST_DATABASE_URL: ""
      TEST_DATABASE_URL: postgresql://llh_touch_ci:llh_touch_ci_secret@localhost:5432/llh_touch_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Real Postgres integration (disposable service container)
        run: npm run test:user-activity-touch-pg
