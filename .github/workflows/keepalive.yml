name: Keepalive

# Pings the live site so a Render Free web service does not spin down from idle.
# Cold starts cause brief 502/503s ("site can't be found") and sever Postgres
# connections (LLH SAFETY postgres_disconnect emails).
#
# Durable fix: upgrade the live service Free → Starter (see docs/RENDER_STARTER_UPGRADE.md).
# Keep this workflow even after upgrade — cheap health signal after deploys.
#
# Read-only GET only — never mutates data.
on:
  schedule:
    # Free tier spins down ~15 min idle; GH cron can lag, so ping every 5 minutes.
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    name: Ping production health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake official site + Render host
        run: |
          set -euo pipefail
          for url in \
            "https://littlelearnershubbyleah.com/api/health" \
            "https://www.littlelearnershubbyleah.com/api/health" \
            "https://little-learner-hub.onrender.com/api/health"
          do
            echo "GET $url"
            # Retry a few times so a mid-deploy 503 does not fail the whole job.
            ok=0
            for i in 1 2 3 4 5; do
              code=$(curl -sS -m 45 -o /tmp/keepalive.json -w "%{http_code}" -L "$url" || echo "000")
              echo "  try $i => HTTP $code"
              if [ "$code" = "200" ]; then
                ok=1
                break
              fi
              sleep 8
            done
            if [ "$ok" != "1" ]; then
              echo "WARN: $url did not return 200 after retries (may be mid-deploy)"
            fi
          done
          # Soft success — keepalive should not page on a single blip.
          exit 0
