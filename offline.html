<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>You're offline — Little Learner Hub</title>
<meta name="theme-color" content="#5b9bd5" />
<style>
  :root { color-scheme: light; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #f8faff 0%, #eef1ff 100%);
    color: #2f3752;
    padding: 24px;
  }
  .offline-card {
    max-width: 420px;
    background: #ffffff;
    border-radius: 20px;
    padding: 32px 28px;
    box-shadow: 0 20px 45px rgba(60, 70, 120, 0.12);
    text-align: center;
  }
  .offline-icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 16px;
    border-radius: 16px;
    background: linear-gradient(135deg, #5b9bd5, #8b7cf6);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 700;
    font-size: 22px;
  }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0 0 20px; color: #5a6180; line-height: 1.5; }
  button {
    border: none;
    background: #5b9bd5;
    color: #fff;
    font-weight: 600;
    padding: 12px 22px;
    border-radius: 12px;
    font-size: 15px;
    cursor: pointer;
  }
  button:hover { background: #4b8bc5; }
</style>
</head>
<body>
  <div class="offline-card">
    <div class="offline-icon" aria-hidden="true">LL</div>
    <h1>You're offline</h1>
    <p>Little Learner Hub can't reach the network right now. Anything you already opened is still saved — messages you send or read will sync automatically once you're back online.</p>
    <button type="button" onclick="window.location.reload()">Try again</button>
    <p style="margin:20px 0 0;font-size:0.8rem;color:#7a8299;">© 2026 Little Learner Hub by Leah. All Rights Reserved.</p>
  </div>
</body>
</html>
